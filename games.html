<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Every game you have played, with the engine's verdict a click away." />
<meta name="theme-color" content="#161512" />
<title>Games · Ultimate Noughts and Crosses</title>
<link rel="stylesheet" href="assets/css/site.css?v=30" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg stroke='%23629924' stroke-width='6' fill='none'%3E%3Cpath d='M36 8v84M64 8v84M8 36h84M8 64h84'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body data-page="games">
<main class="page" id="main">
  <div class="page__head">
    <h1>Your games</h1>
    <p>Every game this browser has finished, newest first. Open one and it goes
       back on the board, where you can step through it and have the engine go
       over the moves.</p>
  </div>

  <div class="tabs" data-tabs hidden>
    <button class="tab" type="button" data-tab="server">Your account</button>
    <button class="tab" type="button" data-tab="local">This browser</button>
  </div>

  <div class="tiles" data-tiles></div>

  <section class="card card--flush" style="margin-top:.9rem">
    <div class="card__head" style="padding:1rem 1rem .2rem">
      <h2>All games</h2>
      <span>
        <select data-filter style="width:auto;display:inline-block">
          <option value="all">Everything</option>
          <option value="online">Online only</option>
          <option value="rated">Rated only</option>
          <option value="computer">Against the engine</option>
          <option value="win">Won</option>
          <option value="loss">Lost</option>
        </select>
      </span>
    </div>
    <div class="scroll" data-table-box>
      <table class="tbl">
        <thead><tr>
          <th></th><th>Opponent</th><th>You were</th><th>Moves</th>
          <th class="num">Rating</th><th>Ended</th><th>When</th><th></th>
        </tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
    <div data-empty></div>
    <div class="row-btn" style="padding:var(--s-3)" data-tools>
      <button class="btn btn--slim" type="button" data-export>Copy them all as text</button>
      <button class="btn btn--slim" type="button" data-forget>Delete my record</button>
    </div>
  </section>
</main>

<script src="assets/js/config.js?v=30"></script>
<script src="assets/js/account.js?v=30"></script>
<script src="assets/js/player.js?v=30"></script>
<script src="assets/js/archive.js?v=30"></script>
<script src="assets/js/site.js?v=30"></script>
<script src="assets/js/games.js?v=30" defer></script>
</body>
</html>
